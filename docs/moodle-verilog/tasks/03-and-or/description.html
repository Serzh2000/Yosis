<p>У модуля <code>gates2</code> два входа <code>a</code>, <code>b</code> и два выхода.</p>
<ul>
<li><code>y_and</code> равен 1, только если <b>и</b> a, <b>и</b> b равны 1 (элемент И, знак <code>&amp;</code>).</li>
<li><code>y_or</code> равен 1, если <b>хотя бы один</b> из a и b равен 1 (элемент ИЛИ, знак <code>|</code>).</li>
</ul>
<table border="1" cellpadding="6"><tr><th>a</th><th>b</th><th>y_and</th><th>y_or</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td><td>1</td></tr>
<tr><td>1</td><td>0</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td><td>1</td></tr></table>
<p>Допишите оба <code>assign</code>. Пример записи с двумя сигналами: <code>assign y = a &amp; b;</code></p>
