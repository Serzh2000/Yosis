<p>Элемент <b>НЕ</b> (инвертор) меняет сигнал на противоположный: 0 становится 1, а 1 становится 0.</p>
<table border="1" cellpadding="6"><tr><th>a</th><th>y</th></tr><tr><td>0</td><td>1</td></tr><tr><td>1</td><td>0</td></tr></table>
<p>В Verilog «НЕ» записывается знаком <code>~</code> перед сигналом: <code>~a</code>.</p>
<p>Допишите в модуле <code>not_gate</code> выражение справа от <code>=</code> так, чтобы выход <code>y</code> был противоположен входу <code>a</code>.</p>
