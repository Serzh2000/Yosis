# Содержимое /etc/nginx/fastpanel2-sites/fastuser/cdod.sakoryagin.ru.includes
# Песочница VPL должна быть доступна браузеру ученика по https/wss: при «Оценить» и «Запуск»
# страница сама подключается к ней. Адрес 127.0.0.1 не годится: для браузера это компьютер ученика.
#
# <СЕКРЕТ> — значение URLPATH из /etc/vpl/vpl-jail-system.conf (лежит в /root/vpl/urlpath.txt).
# После правки: nginx -t && systemctl reload nginx.
# В Moodle: mod_vpl/jail_servers = https://cdod.sakoryagin.ru/<СЕКРЕТ>

location = /<СЕКРЕТ> {
    proxy_pass http://127.0.0.1:8180;
    proxy_http_version 1.1;
    # VPL берёт версию песочницы из заголовка Server; без этого он считает сервер устаревшим
    proxy_pass_header Server;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    client_max_body_size 130m;
}

location ~ "^/[0-9A-Za-z]{8,}/(monitor|execute)$" {
    proxy_pass http://127.0.0.1:8180;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
